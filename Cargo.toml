[package]
name = "adbx"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# TUI 框架；crossterm 经 ratatui::crossterm re-export 使用。
# 关闭默认 features 以剪掉用不到的 calendar/macros 等 widget，只保留 crossterm 后端
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
