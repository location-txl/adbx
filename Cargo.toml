[package]
name = "adbx"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
# 预览常见图片格式，并在终端内缩放为彩色半块字符
image = { version = "0.24.9", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
# 保留默认 features：裁剪 color/suggestions 对体积无收益（LTO 已消除），却会丢失帮助彩色输出与拼写建议
clap = { version = "4", features = ["derive"] }
# TUI 框架；crossterm 经 ratatui::crossterm re-export 使用。
# 关闭默认 features 以剪掉用不到的 calendar/macros 等 widget，只保留 crossterm 后端
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
# 多行文本编辑、撤销/重做、滚动及 Unicode/鼠标光标处理
tui-textarea = { package = "tui-textarea-2", version = "0.13.2", default-features = false, features = ["crossterm"] }
# 与编辑控件保持一致的字符显示宽度计算，用于打开前容量校验
unicode-width = "0.2"

# release 体积优化：去符号 + fat LTO + 单 codegen unit + panic abort + 体积优先
[profile.release]
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = "z"
